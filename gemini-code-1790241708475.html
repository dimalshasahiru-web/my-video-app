<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Streaming App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #212121;
      --text-primary: #ffffff;
      --text-secondary: #aaa;
      --accent-color: #ff0000;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
    }
    header {
      background-color: var(--bg-secondary);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    h1 { margin: 0; font-size: 1.2rem; color: var(--accent-color); }
    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .upload-card {
      background-color: var(--bg-secondary);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
    }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: var(--text-secondary); }
    input[type="text"], textarea, input[type="file"] {
      width: 100%;
      padding: 10px;
      background: #121212;
      border: 1px solid #333;
      color: #fff;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .video-card {
      background-color: var(--bg-secondary);
      border-radius: 8px;
      overflow: hidden;
    }
    video { width: 100%; height: 180px; background: #000; object-fit: cover; }
    .video-info { padding: 12px; }
    .video-title { font-weight: bold; margin-bottom: 5px; font-size: 1rem; }
    .status { margin-top: 10px; color: #00ff00; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <h1>🎬 StreamHub</h1>
  </header>

  <div class="container">
    <div class="upload-card">
      <h2>නව වීඩියෝවක් එක් කරන්න</h2>
      <div class="form-group">
        <label>වීඩියෝ මාතෘකාව (Title)</label>
        <input type="text" id="videoTitle" placeholder="වීඩියෝවේ නම මෙතන දාන්න...">
      </div>
      <div class="form-group">
        <label>විස්තරය (Description)</label>
        <textarea id="videoDesc" rows="3" placeholder="වීඩියෝව ගැන විස්තරයක්..."></textarea>
      </div>
      <div class="form-group">
        <label>වීඩියෝ File එක තෝරන්න</label>
        <input type="file" id="videoFile" accept="video/*">
      </div>
      <button id="uploadBtn" onclick="uploadVideo()">Upload Video</button>
      <div id="status" class="status"></div>
    </div>

    <h2>සියලුම වීඩියෝ</h2>
    <div class="video-grid" id="videoGrid">
      <!-- Upload කරපු වීඩියෝ මෙතන පෙන්නනවා -->
    </div>
  </div>

  <script>
    // CONFIGURATION - FULLY CONFIGURED
    const SUPABASE_URL = "https://ghdwdwzbsqsvwwdmmhok.supabase.co";
    const SUPABASE_KEY = "sb_publishable_f9JeOt0bqnGxjCdeamcccQ_67fHBb6n";

    const TG_BOT_TOKEN = "8991145964:AAFU2c2J0m6JNEFii1tSuCqgqnp1dDxSrz8";
    const TG_CHAT_ID = "@Sinhala_jil_wal";

    // Initialize Supabase
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function uploadVideo() {
      const title = document.getElementById('videoTitle').value;
      const desc = document.getElementById('videoDesc').value;
      const fileInput = document.getElementById('videoFile');
      const status = document.getElementById('status');
      const uploadBtn = document.getElementById('uploadBtn');

      if (!fileInput.files.length || !title) {
        alert("කරුණාකර වීඩියෝවක් සහ මාතෘකාවක් ලබාදෙන්න!");
        return;
      }

      const file = fileInput.files[0];
      const fileName = Date.now() + '_' + file.name;

      uploadBtn.disabled = true;
      status.innerText = "Supabase වෙත Upload වෙමින් පවතී...";

      try {
        // 1. Upload file to Supabase Storage
        const { data, error } = await supabaseClient.storage
          .from('videos')
          .upload(fileName, file);

        if (error) throw error;

        // Get Public URL
        const { data: urlData } = supabaseClient.storage
          .from('videos')
          .getPublicUrl(fileName);

        const videoUrl = urlData.publicUrl;

        status.innerText = "Telegram Channel එකට Notification එක යවමින් පවතී...";

        // 2. Send notification to Telegram Channel
        const tgMessage = `🚀 *නව වීඩියෝවක් එක් කරන ලදී!*\n\n📌 *මාතෘකාව:* ${title}\n📝 *විස්තරය:* ${desc}\n\n🔗 [මෙතනින් බලන්න](${videoUrl})`;
        
        await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TG_CHAT_ID,
            text: tgMessage,
            parse_mode: 'Markdown'
          })
        });

        status.innerText = "✅ සාර්ථකව Upload කර Telegram එකට යවන ලදී!";
        
        // Clear inputs & refresh grid
        document.getElementById('videoTitle').value = '';
        document.getElementById('videoDesc').value = '';
        fileInput.value = '';
        
        addVideoToGrid(title, desc, videoUrl);

      } catch (err) {
        console.error(err);
        status.innerText = "❌ Upload කිරීම අසාර්ථක විය: " + err.message;
      } finally {
        uploadBtn.disabled = false;
      }
    }

    function addVideoToGrid(title, desc, url) {
      const grid = document.getElementById('videoGrid');
      const card = document.createElement('div');
      card.className = 'video-card';
      card.innerHTML = `
        <video controls src="${url}"></video>
        <div class="video-info">
          <div class="video-title">${title}</div>
          <p style="color:#aaa; font-size:0.85rem; margin:5px 0;">${desc}</p>
        </div>
      `;
      grid.prepend(card);
    }
  </script>
</body>
</html>
